version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hireflow-postgres
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow_dev
      POSTGRES_DB: hireflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hireflow-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

